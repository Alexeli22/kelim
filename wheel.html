<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF5FC">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@800;900&display=swap">
<title>גלגל התורנויות</title>
<style>
:root{
  --ink:#14203A; --paper:#FFFFFF; --sky:#EAF5FC; --sun:#D4551F; --teal:#0B6672; --green:#1B7745;
  --line:rgba(11,102,114,.18);
  --text:"Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
  --title:"Heebo","Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
  --wheel:min(560px, 66vh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sky); color:var(--ink); font-family:var(--text);
  height:100vh; height:100dvh; overflow:hidden; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center; padding:clamp(14px,3vh,30px) clamp(16px,3vw,40px);
}
input,button{font-family:var(--text); color:var(--ink)}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:4px solid var(--sun); outline-offset:3px}
.wrap{width:100%; height:100%; max-width:1200px; display:grid; grid-template-columns:minmax(0,430px) minmax(0,1fr); gap:clamp(18px,3vw,48px); align-items:center}
aside{display:flex; flex-direction:column; gap:clamp(10px,2vh,18px); min-height:0; max-height:100%}
h1{font-family:var(--title); font-weight:900; font-size:clamp(28px,5vh,40px); line-height:1}
h1 span{color:var(--teal)}
.q{display:flex; align-items:center; gap:8px; border-bottom:3px dashed var(--line)}
.q:focus-within{border-bottom-color:var(--sun)}
.q textarea{flex:1; min-width:0; resize:none; border:0; background:transparent; font-family:var(--title); font-weight:900; font-size:clamp(24px,4.4vh,34px); line-height:1.15; color:var(--ink); padding:2px 0; height:2.4em; overflow:hidden}
.q textarea:focus{outline:none}
.pen{width:22px; height:22px; flex:none; opacity:.45}
.box{background:var(--paper); border-radius:20px; padding:clamp(12px,2.2vh,18px); display:flex; flex-direction:column; gap:clamp(8px,1.4vh,12px); min-height:0}
.lbl{font-size:16px; font-weight:700; color:var(--teal)}
.names{list-style:none; display:flex; flex-wrap:wrap; gap:8px; overflow:auto; min-height:0}
.chip{display:flex; align-items:center; gap:6px; background:var(--sky); border-radius:999px; padding:0 6px 0 14px; min-height:44px; font-weight:700; font-size:clamp(17px,2.8vh,20px)}
.chip .ok{display:none; width:22px; height:22px; border-radius:50%; background:var(--green); place-items:center}
.chip .ok svg{width:14px; height:14px}
.chip.went{background:#E3F0E8; color:var(--green)}
.chip.went .ok{display:grid}
.chip.won{outline:3px solid var(--sun)}
.chip button{position:relative; width:34px; height:34px; border:0; background:transparent; border-radius:50%; display:grid; place-items:center; opacity:.4}
.chip button::after{content:""; position:absolute; inset:-5px}
.chip button:hover{opacity:.9; background:rgba(255,255,255,.7)}
.chip button svg{width:14px; height:14px}
.add{display:flex; gap:8px}
.add input{flex:1; min-width:0; font-size:19px; min-height:52px; border-radius:14px; border:3px solid var(--line); padding:0 14px; background:var(--sky)}
.add input:focus{outline:none; border-color:var(--sun)}
.add button{min-height:52px; padding:0 20px; border-radius:14px; border:0; background:var(--teal); color:#fff; font-weight:700; font-size:18px; white-space:nowrap}
.fair{display:flex; align-items:center; gap:12px; cursor:pointer}
.fair input{position:absolute; opacity:0; width:1px; height:1px}
.track{flex:none; width:54px; height:32px; border-radius:16px; background:#C9DCE3; position:relative; transition:background .2s}
.track::after{content:""; position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(20,32,58,.25); transition:transform .2s}
.fair input:checked + .track{background:var(--green)}
.fair input:checked + .track::after{transform:translateX(-22px)}
.fair input:focus-visible + .track{outline:4px solid var(--sun); outline-offset:2px}
.fair b{display:block; font-size:clamp(18px,2.9vh,21px)}
.fair small{display:block; font-size:15px; opacity:.75; line-height:1.3}
.round{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:16px; font-weight:500; min-height:24px}
.round button{border:0; background:none; color:var(--teal); font-weight:700; font-size:16px; text-decoration:underline; min-height:44px; padding:0 4px}

.stage{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(8px,1.6vh,14px); min-height:0}
.wheel{position:relative; width:var(--wheel); height:var(--wheel)}
.wheel canvas{width:100%; height:100%; display:block; border-radius:50%; box-shadow:0 0 0 8px var(--paper), 0 0 0 11px rgba(11,102,114,.25)}
.pointer{position:absolute; top:-26px; left:50%; width:54px; height:62px; margin-left:-27px; transform-origin:50% 22%; z-index:2; filter:drop-shadow(0 2px 2px rgba(20,32,58,.3))}
.hub{position:absolute; top:50%; left:50%; width:29%; height:29%; transform:translate(-50%,-50%); border-radius:50%; border:6px solid var(--teal); background:var(--paper);
  font-family:var(--title); font-weight:900; font-size:calc(var(--wheel) * .066); color:var(--teal); box-shadow:0 4px 0 rgba(11,102,114,.35); z-index:2}
.hub:active{transform:translate(-50%,-48%); box-shadow:0 1px 0 rgba(11,102,114,.35)}
.hub:disabled{color:rgba(11,102,114,.4); cursor:default}
.res{text-align:center; min-height:clamp(64px,11vh,92px); display:flex; flex-direction:column; align-items:center; justify-content:center}
.res .k{font-size:clamp(16px,2.6vh,20px); font-weight:700; color:var(--teal)}
.res .v{font-family:var(--title); font-weight:900; font-size:clamp(38px,7.4vh,60px); line-height:1.05; color:var(--ink)}
.res .hint{font-size:clamp(18px,3vh,23px); font-weight:500; opacity:.8}
.res.win .v{animation:pop .6s cubic-bezier(.2,1.5,.4,1) both; color:var(--sun)}
@keyframes pop{0%{transform:scale(.3); opacity:0}100%{transform:scale(1); opacity:1}}

@media (max-width:820px){
  :root{--wheel:min(86vw, 52vh)}
  body{height:auto; min-height:100dvh; overflow:auto; display:block}
  .wrap{grid-template-columns:minmax(0,1fr); height:auto; gap:14px}
  aside{display:contents}
  h1{order:1} .q{order:2} .stage{order:3; padding-top:30px} aside .box{order:4}
  .wheel canvas{box-shadow:0 0 0 6px var(--paper), 0 0 0 9px rgba(11,102,114,.25)}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>גלגל <span>התורנויות</span></h1>
    <label class="q"><textarea id="q" rows="2" maxlength="60" aria-label="השאלה"></textarea><svg class="pen" viewBox="0 0 24 24" fill="none" stroke="#14203A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></label>
    <div class="box">
      <div class="lbl" id="cnt">מי משתתף?</div>
      <ul class="names" id="names"></ul>
      <form class="add" id="addForm"><input id="addIn" type="text" maxlength="14" placeholder="שם חדש" aria-label="שם חדש" enterkeyhint="done"><button type="submit">הוספה</button></form>
    </div>
    <div class="box">
      <label class="fair"><input type="checkbox" id="fair"><span class="track"></span><span><b>תור הוגן</b><small>מי שיצא מחכה עד שכולם יקבלו תור</small></span></label>
      <div class="round" id="round"><span id="roundTxt"></span><button type="button" id="newRound">סבב חדש</button></div>
    </div>
  </aside>

  <main class="stage">
    <div class="wheel" id="wheelBox">
      <svg class="pointer" id="pointer" viewBox="0 0 54 62" aria-hidden="true"><path d="M27 60 L6 16 A23 23 0 1 1 48 16 Z" fill="#D4551F" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><circle cx="27" cy="20" r="7" fill="#fff"/></svg>
      <canvas id="wheel" aria-hidden="true"></canvas>
      <button class="hub" id="spin" type="button">לסובב</button>
    </div>
    <div class="res" id="res" aria-live="polite"><div class="hint">לוחצים על "לסובב" באמצע הגלגל</div></div>
  </main>
</div>

<script>
(function(){
  var KEY = 'wheel-v1';
  var PAL = ['#0B6672', '#14203A', '#1B7745', '#3D8A94'];
  var TAU = Math.PI * 2, DUR = 3600;
  var X = '<svg viewBox="0 0 24 24" fill="none" stroke="#14203A" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){ return document.getElementById(id); };

  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.names)) S = {q:'מי מוריד את הזבל השבוע?', names:['דנה', 'יוסי', 'מיכל', 'אבי'], fair:true, went:[]};
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var cv = $('wheel'), ctx = cv.getContext('2d'), rot = 0, spinning = false, winIdx = -1, kick = 0, lastIdx = -1;

  function colorOf(i, n){ return (n % 4 === 1 && n > 1 && i === n - 1) ? PAL[2] : PAL[i % 4]; }
  function went(name){ return S.fair && S.went.indexOf(name) > -1; }
  function idxAt(r){ var n = S.names.length, a = ((-r % TAU) + TAU) % TAU; return Math.min(n - 1, Math.floor(a / (TAU / n))); }

  function size(){
    var css = cv.getBoundingClientRect().width, dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(css * dpr); cv.height = Math.round(css * dpr);
    draw();
  }
  function draw(){
    var W = cv.width, R = W / 2, n = S.names.length;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W);
    ctx.translate(R, R);
    if (!n){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill(); return; }
    var seg = TAU / n;
    for (var i = 0; i < n; i++){
      var a0 = rot - Math.PI / 2 + i * seg, a1 = a0 + seg, done = went(S.names[i]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a1); ctx.closePath();
      ctx.fillStyle = done ? '#D6E8EC' : colorOf(i, n); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = R * 0.012; ctx.stroke();
      if (i === winIdx && !spinning){ ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R - R * 0.025, a0 + 0.01, a1 - 0.01); ctx.strokeStyle = '#D4551F'; ctx.lineWidth = R * 0.05; ctx.stroke(); ctx.restore(); }
      // label along the radius, ending near the rim
      var mid = a0 + seg / 2, g = ((mid % TAU) + TAU) % TAU, flip = g > Math.PI / 2 && g < Math.PI * 1.5;
      ctx.save(); ctx.rotate(flip ? mid + Math.PI : mid);
      var name = S.names[i], inner = R * 0.33, room = R * 0.92 - inner;
      ctx.font = '900 100px Heebo, Assistant, "Arial Hebrew", "Helvetica Neue", sans-serif';
      var w = ctx.measureText(name).width || 1;
      var fs = Math.min(R * 0.13, 100 * room / w, Math.sin(Math.min(seg, Math.PI / 2) / 2) * inner * 2.2 + R * 0.04);
      ctx.font = '900 ' + fs + 'px Heebo, Assistant, "Arial Hebrew", "Helvetica Neue", sans-serif';
      ctx.fillStyle = done ? 'rgba(20,32,58,.45)' : '#fff';
      ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
      if (flip){ ctx.textAlign = 'left'; ctx.fillText(name, -R * 0.92, 0); }   // left half: keep the name upright
      else { ctx.textAlign = 'right'; ctx.fillText(name, R * 0.92, 0); }
      ctx.restore();
    }
    // pegs on the rim
    for (var k = 0; k < n; k++){
      var pa = rot - Math.PI / 2 + k * seg;
      ctx.beginPath(); ctx.arc(Math.cos(pa) * R * 0.955, Math.sin(pa) * R * 0.955, R * 0.018, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    }
  }

  function chips(){
    var ul = $('names'); ul.innerHTML = '';
    S.names.forEach(function(nm, i){
      var li = document.createElement('li'); li.className = 'chip' + (went(nm) ? ' went' : '') + (i === winIdx ? ' won' : '');
      li.innerHTML = '<span class="ok" aria-hidden="true">' + CHECK + '</span><span class="t"></span><button type="button">' + X + '</button>';
      li.querySelector('.t').textContent = nm;
      var b = li.querySelector('button'); b.setAttribute('aria-label', 'להוריד את ' + nm);
      b.addEventListener('click', function(){ if (spinning) return; S.names.splice(i, 1); S.went = S.went.filter(function(x){ return S.names.indexOf(x) > -1; }); winIdx = -1; refresh(); });
      ul.appendChild(li);
    });
    $('cnt').textContent = 'מי משתתף? (' + S.names.length + ')';
    var left = S.names.filter(function(x){ return !went(x); }).length;
    $('round').style.visibility = S.fair ? 'visible' : 'hidden';
    $('roundTxt').textContent = !S.went.length ? 'עוד לא יצא אף אחד בסבב' : (left ? 'בסבב הזה נשארו ' + left : 'כולם קיבלו תור. הסיבוב הבא פותח סבב חדש');
    $('spin').disabled = spinning || S.names.length < 2;
  }
  function refresh(){ save(); chips(); draw(); }

  function showRes(name){
    var r = $('res'); r.className = 'res';
    if (name == null){ r.innerHTML = '<div class="hint">' + (S.names.length < 2 ? 'מוסיפים לפחות שני שמות' : 'לוחצים על "לסובב" באמצע הגלגל') + '</div>'; return; }
    r.innerHTML = '<div class="k"></div><div class="v"></div>';
    r.querySelector('.k').textContent = S.q.trim() || 'הגלגל בחר';
    r.querySelector('.v').textContent = name;
    void r.offsetWidth; r.classList.add('win');
  }

  function spin(){
    var n = S.names.length;
    if (spinning || n < 2) return;
    if (S.fair && S.names.every(function(x){ return S.went.indexOf(x) > -1; })) S.went = [];
    var pool = [];
    S.names.forEach(function(x, i){ if (!went(x)) pool.push(i); });
    var target = pool[Math.floor(Math.random() * pool.length)], seg = TAU / n;
    var local = (target + 0.5 + (Math.random() - 0.5) * 0.7) * seg;   // where the pointer will rest inside the segment
    var start = rot, delta = (((-local - start) % TAU) + TAU) % TAU;
    var end = start + (reduce ? 1 : 5) * TAU + delta, dur = reduce ? 700 : DUR, t0 = performance.now();
    spinning = true; winIdx = -1; chips(); $('res').innerHTML = '<div class="hint">מסתובב...</div>'; $('res').className = 'res';
    lastIdx = idxAt(rot);
    (function frame(t){
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      rot = start + (end - start) * e;
      var ix = idxAt(rot);
      if (ix !== lastIdx){ lastIdx = ix; kick = 1; }
      kick *= 0.82;
      $('pointer').style.transform = 'rotate(' + (kick * 22) + 'deg)';
      draw();
      if (k < 1){ requestAnimationFrame(frame); return; }
      rot = end % TAU;
      $('pointer').style.transform = '';
      spinning = false;
      winIdx = idxAt(rot);                        // read the result from where the wheel actually stopped
      cv.dataset.rot = String(rot); cv.dataset.picked = String(target);
      var name = S.names[winIdx];
      if (S.fair && S.went.indexOf(name) < 0) S.went.push(name);
      refresh(); showRes(name);
    })(t0);
  }

  $('spin').addEventListener('click', spin);
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = $('addIn'), v = inp.value.trim();
    if (!v || spinning) return;
    if (S.names.length >= 16){ inp.value = ''; return; }
    var base = v, k = 2; while (S.names.indexOf(v) > -1){ v = base + ' ' + k++; }
    S.names.push(v); inp.value = ''; winIdx = -1; refresh(); showRes(null); inp.focus();
  });
  $('q').addEventListener('input', function(e){ S.q = e.target.value.replace(/\n/g, ' '); save(); });
  $('fair').addEventListener('change', function(e){ S.fair = e.target.checked; if (!S.fair) S.went = []; refresh(); });
  $('newRound').addEventListener('click', function(){ S.went = []; winIdx = -1; refresh(); showRes(null); });
  window.addEventListener('resize', size);

  $('q').value = S.q; $('fair').checked = S.fair;
  chips(); size(); showRes(null);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  window.__wheel = {idxAt:function(){ return idxAt(rot); }, names:function(){ return S.names.slice(); }, went:function(){ return S.went.slice(); }};
})();
</script>
</body>
</html>
