<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF5FC">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@800;900&display=swap">
<title>לוח החופשה</title>
<style>
:root{
  --ink:#14203A; --paper:#FFFFFF; --sky:#EAF5FC; --sun:#D4551F; --teal:#0B6672; --green:#1B7745;
  --line:rgba(11,102,114,.18);
  --text:"Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
  --title:"Heebo","Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sky); color:var(--ink); font-family:var(--text);
  height:100vh; height:100dvh; overflow:hidden; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; padding:clamp(12px,2.4vh,24px) clamp(16px,2.4vw,32px);
  gap:clamp(10px,1.8vh,16px);
}
input,button{font-family:var(--text); color:var(--ink)}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:4px solid var(--sun); outline-offset:3px}
header{display:flex; align-items:center; justify-content:space-between; gap:16px}
h1{font-family:var(--title); font-weight:900; font-size:clamp(30px,5.6vh,44px); line-height:1}
h1 span{color:var(--teal)}
.reset{font-weight:700; font-size:17px; min-height:46px; padding:0 20px; border-radius:999px; border:3px solid var(--teal); background:transparent; color:var(--teal); white-space:nowrap}

.grid{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.15fr); gap:clamp(12px,1.6vw,20px)}
.panel{background:var(--paper); border-radius:20px; padding:clamp(14px,2.4vh,22px) clamp(16px,1.6vw,22px); display:flex; flex-direction:column; min-height:0; gap:clamp(8px,1.4vh,12px)}
.ptitle{display:flex; align-items:center; gap:10px; font-weight:700; font-size:clamp(18px,2.9vh,22px); color:var(--teal)}
.ptitle svg{width:26px; height:26px; flex:none}
.lbl{font-size:16px; font-weight:500; opacity:.75}

/* countdown */
.dest{display:flex; align-items:center; gap:8px; border-bottom:3px dashed var(--line); padding-bottom:2px}
.dest input{flex:1; min-width:0; border:0; background:transparent; font-family:var(--title); font-weight:900; font-size:clamp(36px,7vh,54px); line-height:1.1; padding:0}
.dest input:focus{outline:none} .dest:focus-within{border-bottom-color:var(--sun)}
.pen{width:22px; height:22px; flex:none; opacity:.45}
.count{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:0}
.count .pre{font-family:var(--title); font-weight:900; font-size:clamp(24px,4.4vh,34px); line-height:1}
.count .num{font-family:var(--title); font-weight:900; font-size:clamp(90px,21vh,164px); line-height:.95; color:var(--teal); font-variant-numeric:tabular-nums}
.count .unit{font-family:var(--title); font-weight:900; font-size:clamp(26px,4.8vh,38px); line-height:1}
.count .weeks{margin-top:6px; font-size:clamp(16px,2.6vh,20px); font-weight:500; opacity:.8; min-height:1.3em}
.count.past .num{color:var(--sun)}
.trail{position:relative; height:34px; margin:0 4px}
.trail::before{content:""; position:absolute; inset:50% 0 auto 0; border-top:3px dotted rgba(11,102,114,.4)}
.trail .home,.trail .away{position:absolute; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%; background:var(--teal)}
.trail .home{right:0} .trail .away{left:0; background:var(--sun)}
.plane{position:absolute; top:50%; width:34px; height:34px; margin:-17px -17px 0 0; transition:right 1s cubic-bezier(.3,.7,.3,1)}
.dates{display:flex; flex-direction:column; gap:8px}
.daterow{display:grid; grid-template-columns:62px auto 1fr; align-items:center; gap:10px}
.daterow .lbl{opacity:1; font-weight:700}
.daterow input{max-width:100%; font-size:19px; font-weight:700; min-height:52px; padding:0 12px; border:3px solid var(--line); border-radius:14px; background:var(--sky)}
.day{font-size:17px; font-weight:500}
.tripspan{background:var(--sky); border-radius:14px; padding:10px 14px; text-align:center; font-size:clamp(18px,2.9vh,21px); font-weight:500}
.tripspan b{font-family:var(--title); font-weight:900; font-size:1.25em; color:var(--teal)}

/* budget */
.total{display:flex; align-items:center; justify-content:space-between; gap:10px}
.money{display:flex; align-items:center; gap:6px; background:var(--sky); border-radius:12px; padding:0 12px; border:3px solid transparent}
.money:focus-within{border-color:var(--sun)}
.money input{width:4.4em; border:0; background:transparent; font-weight:700; font-size:clamp(18px,2.9vh,22px); min-height:clamp(40px,6.2vh,48px); text-align:left; direction:ltr; font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money span{font-size:16px; font-weight:500; opacity:.7}
.total .money input{font-size:clamp(22px,3.6vh,28px); width:4.6em}
.stack{display:flex; height:18px; border-radius:9px; overflow:hidden; background:var(--sky)}
.stack i{display:block; height:100%; transition:width .4s}
.stack i.over{background:var(--sun)}
.cats{display:flex; flex-direction:column; gap:clamp(4px,1vh,8px); flex:1; justify-content:center}
.cat{display:grid; grid-template-columns:14px 1fr auto; align-items:center; column-gap:10px; row-gap:3px}
.cat .dot{width:14px; height:14px; border-radius:50%}
.cat .nm{font-size:clamp(18px,2.9vh,22px); font-weight:500}
.cat .share{grid-column:2 / 4; height:5px; border-radius:3px; background:var(--sky); overflow:hidden}
.cat .share b{display:block; height:100%; transition:width .4s}
.left{display:flex; align-items:baseline; justify-content:space-between; gap:10px; border-top:3px solid var(--sky); padding-top:clamp(6px,1.2vh,10px)}
.left .k{font-family:var(--title); font-weight:900; font-size:clamp(24px,4.2vh,32px)}
.left .v{font-family:var(--title); font-weight:900; font-size:clamp(34px,6.4vh,50px); color:var(--green); font-variant-numeric:tabular-nums; line-height:1}
.left .v small{font-size:.45em}
.left.over .v,.left.over .k{color:var(--sun)}
.planned{font-size:16px; font-weight:500; opacity:.8}

/* packing */
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.tab{min-width:0; min-height:54px; border-radius:14px; border:3px solid transparent; background:var(--sky); font-weight:700; font-size:17px; line-height:1.1; padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; overflow:hidden}
.tab small{font-weight:500; font-size:14px; opacity:.75; font-variant-numeric:tabular-nums}
.tab .t{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--teal); color:#fff}
.tab.full small{opacity:1}
.who{display:flex; align-items:center; gap:8px; font-size:17px; font-weight:500}
.who input{flex:1; min-width:0; font-weight:700; font-size:19px; min-height:42px; border:0; border-bottom:3px dashed var(--line); background:transparent; padding:0 2px}
.who input:focus{outline:none; border-bottom-color:var(--sun)}
.list{list-style:none; flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:2px; margin:0 -6px; padding:0 6px}
.item{display:flex; align-items:center; gap:10px; min-height:clamp(32px,4.6vh,44px); border-radius:10px}
.item label{flex:1; display:flex; align-items:center; gap:12px; cursor:pointer; font-size:clamp(18px,2.8vh,21px); min-height:inherit}
.item input{position:absolute; opacity:0; width:1px; height:1px}
.box{flex:none; width:28px; height:28px; border-radius:8px; border:3px solid var(--teal); display:grid; place-items:center; transition:background .15s}
.box svg{width:18px; height:18px; opacity:0}
.item input:checked + .box{background:var(--green); border-color:var(--green)}
.item input:checked + .box svg{opacity:1}
.item input:checked ~ .tx{opacity:.5; text-decoration:line-through}
.item input:focus-visible + .box{outline:4px solid var(--sun); outline-offset:2px}
.del{flex:none; width:44px; height:44px; border:0; background:transparent; border-radius:50%; opacity:.35; display:grid; place-items:center}
.del:hover{opacity:.8; background:var(--sky)}
.del svg{width:16px; height:16px}
.add{display:flex; gap:8px}
.add input{flex:1; min-width:0; font-size:18px; min-height:50px; border-radius:14px; border:3px solid var(--line); padding:0 14px; background:var(--sky)}
.add input:focus{outline:none; border-color:var(--sun)}
.add button{min-height:50px; padding:0 18px; border-radius:14px; border:0; background:var(--teal); color:#fff; font-weight:700; font-size:18px; white-space:nowrap}
.packed{display:flex; align-items:center; gap:12px}
.packed b{font-family:var(--title); font-weight:900; font-size:clamp(20px,3.4vh,26px); white-space:nowrap}
.packed .bar{flex:1; height:10px; border-radius:5px; background:var(--sky); overflow:hidden}
.packed .bar i{display:block; height:100%; background:var(--green); transition:width .4s}

@media (max-width:900px){
  body{height:auto; min-height:100dvh; overflow:auto}
  .grid{grid-template-columns:minmax(0,1fr)}
  .count{padding:8px 0}
  .list{overflow:visible}
  h1{font-size:34px}
  .reset{font-size:15px; min-height:44px; padding:0 14px}
}
@media (min-width:700px) and (max-width:900px){
  .dates{flex-direction:row; gap:22px}
  .dates .daterow{flex:1}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<header>
  <h1>לוח <span>החופשה</span></h1>
  <button class="reset" id="reset" type="button">חזרה לדוגמה</button>
</header>

<div class="grid">
  <!-- countdown -->
  <section class="panel" aria-label="ספירה לאחור">
    <div class="ptitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>לאן טסים?</div>
    <label class="dest"><input id="dest" type="text" maxlength="18" aria-label="שם היעד"><svg class="pen" viewBox="0 0 24 24" fill="none" stroke="#14203A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></label>
    <div class="count" id="count" aria-live="polite">
      <div class="pre" id="pre">עוד</div>
      <div class="num" id="num">40</div>
      <div class="unit" id="unit">ימים</div>
      <div class="weeks" id="weeks"></div>
    </div>
    <div class="trail" aria-hidden="true"><span class="home"></span><span class="away"></span>
      <svg class="plane" id="plane" viewBox="0 0 48 48"><path d="M6 26 L18 24 L28 10 L33 10 L28 24 L38 23 L42 18 L45 18 L43 25 L45 32 L42 32 L38 27 L28 26 L33 40 L28 40 L18 28 L6 26 Z" fill="#0B6672" transform="scale(-1,1) translate(-48,0)"/></svg>
    </div>
    <div class="dates">
      <div class="daterow"><label class="lbl" for="date">יוצאים</label><input id="date" type="date" aria-label="תאריך היציאה"><span class="day" id="day"></span></div>
      <div class="daterow"><label class="lbl" for="end">חוזרים</label><input id="end" type="date" aria-label="תאריך החזרה"><span class="day" id="day2"></span></div>
    </div>
    <div class="tripspan" id="span" aria-live="polite"></div>
  </section>

  <!-- budget -->
  <section class="panel" aria-label="תקציב">
    <div class="ptitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>התקציב</div>
    <div class="total"><span style="font-size:clamp(19px,3vh,23px);font-weight:700;white-space:nowrap">תקציב כולל</span>
      <label class="money"><input id="total" inputmode="numeric" aria-label="תקציב כולל"><span>ש״ח</span></label></div>
    <div class="stack" id="stack" aria-hidden="true"></div>
    <div class="planned" id="planned"></div>
    <div class="cats" id="cats"></div>
    <div class="left" id="left"><span class="k" id="leftK">נשאר</span><span class="v" id="leftV">0</span></div>
  </section>

  <!-- packing -->
  <section class="panel" aria-label="רשימת אריזה">
    <div class="ptitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M9 7V4h6v3M9 11v5M15 11v5"/></svg>מה אורזים</div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <label class="who">הרשימה של <input id="who" type="text" maxlength="12" aria-label="שם המטייל"></label>
    <ul class="list" id="list"></ul>
    <form class="add" id="addForm"><input id="addIn" type="text" maxlength="30" placeholder="מה עוד צריך לארוז?" aria-label="פריט חדש"><button type="submit">הוספה</button></form>
    <div class="packed"><b id="packedTxt"></b><span class="bar"><i id="packedBar"></i></span></div>
  </section>
</div>

<script>
(function(){
  var KEY = 'trip-board-v1';
  var COLORS = ['#0B6672', '#1B7745', '#14203A', '#5E9EA6', '#A9CDD2'];
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  var X = '<svg viewBox="0 0 24 24" fill="none" stroke="#14203A" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function inDays(n){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + n); return iso(d); }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function items(list, done){ return list.map(function(t, i){ return {t:t, ok: done.indexOf(i) > -1}; }); }
  function example(){
    return {
      dest:'רומא', date:inDays(40), end:inDays(44), total:24000,
      cats:[{n:'טיסות', v:7600}, {n:'לינה', v:6500}, {n:'אוכל', v:4000}, {n:'אטרקציות', v:2200}, {n:'קניות', v:1500}],
      cur:0,
      people:[
        {n:'דנה', items:items(['דרכון', 'מעיל חם', 'מטען לטלפון', 'נעלי הליכה', 'מטרייה קטנה', 'תרופות קבועות', 'מתאם לשקע', 'צעיף', 'משקפי שמש'], [0, 2, 5])},
        {n:'יואב', items:items(['דרכון', 'מעיל', 'סוודר', 'נעלי ספורט', 'אוזניות', 'מצלמה'], [0])},
        {n:'נועה', items:items(['דרכון', 'מעיל', 'כובע צמר', 'ספר לטיסה', 'בקבוק מים', 'פיג׳מה', 'כפפות'], [0, 3])},
        {n:'איתי', items:items(['דרכון', 'מעיל', 'משחק לטיסה', 'בובה לשינה', 'מגפיים'], [])}
      ]
    };
  }
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.people || S.people.length !== 4) S = example();
  function parse(v){ var p = (v || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2], 12) : null; }
  function addDays(v, n){ var d = parse(v) || new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return iso(d); }
  if (!S.end) S.end = addDays(S.date, 4);
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var $ = function(id){ return document.getElementById(id); };
  function fmt(n){ return Math.round(n).toLocaleString('he-IL'); }
  function num(s){ var v = parseInt(String(s).replace(/[^\d]/g, ''), 10); return isNaN(v) ? 0 : v; }

  /* countdown */
  var DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  var MONTHS = ['בינואר', 'בפברואר', 'במרץ', 'באפריל', 'במאי', 'ביוני', 'ביולי', 'באוגוסט', 'בספטמבר', 'באוקטובר', 'בנובמבר', 'בדצמבר'];
  function paintCount(){
    var p = (S.date || '').split('-');
    var count = $('count'), pre = $('pre'), numEl = $('num'), unit = $('unit'), weeks = $('weeks');
    count.classList.remove('past');
    if (p.length !== 3){ pre.textContent = 'בוחרים'; numEl.textContent = '?'; unit.textContent = 'תאריך'; weeks.textContent = ''; $('day').textContent = ''; return; }
    var t = new Date(+p[0], +p[1] - 1, +p[2], 12), now = new Date(); now.setHours(12, 0, 0, 0);
    var n = Math.round((t - now) / 864e5);
    $('day').textContent = 'יום ' + DAYS[t.getDay()];
    if (n > 2){ pre.textContent = 'עוד'; numEl.textContent = n; unit.textContent = 'ימים'; }
    else if (n === 2){ pre.textContent = 'עוד'; numEl.textContent = '2'; unit.textContent = 'ימים, מחרתיים!'; }
    else if (n === 1){ pre.textContent = 'טסים'; numEl.textContent = 'מחר'; unit.textContent = 'לבדוק דרכונים'; }
    else if (n === 0){ pre.textContent = 'טסים'; numEl.textContent = 'היום'; unit.textContent = 'נסיעה טובה'; }
    else { count.classList.add('past'); pre.textContent = 'הטיסה הייתה לפני'; numEl.textContent = -n; unit.textContent = 'ימים'; }
    var w = Math.floor(n / 7), d = n % 7;
    weeks.textContent = n >= 14 ? ('שזה ' + w + ' שבועות' + (d ? ' ו-' + d + (d === 1 ? ' יום' : ' ימים') : '')) : '';
    var f = Math.max(0, Math.min(1, 1 - n / 90));
    $('plane').style.right = 'calc(' + (f * 100) + '% + ' + (17 - f * 34) + 'px)';
  }

  /* how long is the trip */
  function paintSpan(){
    var a = parse(S.date), b = parse(S.end), el = $('span');
    $('day2').textContent = b ? 'יום ' + DAYS[b.getDay()] : '';
    $('end').min = S.date || '';
    if (!a || !b){ el.textContent = 'בוחרים תאריך יציאה ותאריך חזרה'; return; }
    var nights = Math.round((b - a) / 864e5), days = nights + 1;
    var dTxt = days === 1 ? 'יום אחד' : days === 2 ? 'יומיים' : days + ' ימים';
    var nTxt = nights === 0 ? 'בלי לינה' : nights === 1 ? 'לילה אחד' : nights === 2 ? 'שני לילות' : nights + ' לילות';
    el.innerHTML = 'סך הכול <b>' + dTxt + '</b> · ' + nTxt;
  }

  /* budget */
  function buildCats(){
    var box = $('cats'); box.innerHTML = '';
    S.cats.forEach(function(c, i){
      var row = document.createElement('div'); row.className = 'cat';
      row.innerHTML = '<span class="dot" style="background:' + COLORS[i] + '"></span><span class="nm"></span>' +
        '<label class="money"><input inputmode="numeric"><span>ש״ח</span></label><span class="share"><b style="background:' + COLORS[i] + '"></b></span>';
      row.querySelector('.nm').textContent = c.n;
      var inp = row.querySelector('input'); inp.value = fmt(c.v); inp.setAttribute('aria-label', 'סכום ל' + c.n);
      inp.addEventListener('input', function(){ c.v = num(inp.value); paintBudget(); save(); });
      inp.addEventListener('focus', function(){ inp.value = c.v || ''; inp.select(); });
      inp.addEventListener('blur', function(){ inp.value = fmt(c.v); });
      box.appendChild(row);
    });
  }
  function paintBudget(){
    var sum = S.cats.reduce(function(a, c){ return a + c.v; }, 0), total = S.total;
    var base = Math.max(total, sum, 1);
    var st = $('stack'); st.innerHTML = '';
    var acc = 0;
    S.cats.forEach(function(c, i){
      var room = Math.max(0, Math.min(c.v, total - acc)); acc += c.v;
      var seg = document.createElement('i'); seg.style.width = (room / base * 100) + '%'; seg.style.background = COLORS[i]; st.appendChild(seg);
    });
    if (sum > total){ var o = document.createElement('i'); o.className = 'over'; o.style.width = ((sum - total) / base * 100) + '%'; st.appendChild(o); }
    document.querySelectorAll('.cat .share b').forEach(function(b, i){ b.style.width = (total ? Math.min(100, S.cats[i].v / total * 100) : 0) + '%'; });
    var pct = total ? Math.round(sum / total * 100) : 0;
    $('planned').textContent = 'מתוכנן ' + fmt(sum) + ' ש״ח, ' + pct + '% מהתקציב';
    var left = total - sum, L = $('left');
    L.classList.toggle('over', left < 0);
    $('leftK').textContent = left < 0 ? 'חריגה' : 'נשאר';
    $('leftV').innerHTML = fmt(Math.abs(left)) + ' <small>ש״ח</small>';
  }

  /* packing */
  function buildTabs(){
    var box = $('tabs'); box.innerHTML = '';
    S.people.forEach(function(p, i){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.innerHTML = '<span class="t"></span><small></small>';
      b.addEventListener('click', function(){ S.cur = i; paintPack(); save(); });
      box.appendChild(b);
    });
  }
  function paintTabs(){
    document.querySelectorAll('.tab').forEach(function(b, i){
      var p = S.people[i], ok = p.items.filter(function(x){ return x.ok; }).length;
      b.querySelector('.t').textContent = p.n || 'בלי שם';
      b.querySelector('small').textContent = ok + '/' + p.items.length;
      b.setAttribute('aria-selected', i === S.cur ? 'true' : 'false');
    });
  }
  function paintCountPack(){
    var p = S.people[S.cur], ok = p.items.filter(function(x){ return x.ok; }).length, all = p.items.length;
    $('packedTxt').textContent = all && ok === all ? 'הכל ארוז!' : 'ארוזים ' + ok + ' מתוך ' + all;
    $('packedBar').style.width = (all ? ok / all * 100 : 0) + '%';
    paintTabs();
  }
  function paintPack(){
    var p = S.people[S.cur], list = $('list');
    $('who').value = p.n;
    list.innerHTML = '';
    p.items.forEach(function(it, i){
      var li = document.createElement('li'); li.className = 'item';
      li.innerHTML = '<label><input type="checkbox"><span class="box">' + CHECK + '</span><span class="tx"></span></label><button class="del" type="button">' + X + '</button>';
      li.querySelector('.tx').textContent = it.t;
      var cb = li.querySelector('input'); cb.checked = it.ok;
      cb.addEventListener('change', function(){ it.ok = cb.checked; paintCountPack(); save(); });
      var del = li.querySelector('.del'); del.setAttribute('aria-label', 'למחוק את ' + it.t);
      del.addEventListener('click', function(){ p.items.splice(i, 1); paintPack(); save(); });
      list.appendChild(li);
    });
    paintCountPack();
  }

  function init(){
    $('dest').value = S.dest;
    $('date').value = S.date;
    $('end').value = S.end;
    $('total').value = fmt(S.total);
    buildCats(); buildTabs();
    paintCount(); paintSpan(); paintBudget(); paintPack();
  }
  $('dest').addEventListener('input', function(e){ S.dest = e.target.value; save(); });
  $('date').addEventListener('input', function(e){
    var a = parse(S.date), b = parse(S.end), len = (a && b) ? Math.max(0, Math.round((b - a) / 864e5)) : 4;
    S.date = e.target.value;
    if (parse(S.date)){ S.end = addDays(S.date, len); $('end').value = S.end; }
    paintCount(); paintSpan(); save();
  });
  $('end').addEventListener('input', function(e){
    var v = e.target.value;
    if (v && parse(S.date) && parse(v) < parse(S.date)){ v = S.date; e.target.value = v; }
    S.end = v; paintSpan(); save();
  });
  var tot = $('total');
  tot.addEventListener('input', function(){ S.total = num(tot.value); paintBudget(); save(); });
  tot.addEventListener('focus', function(){ tot.value = S.total || ''; tot.select(); });
  tot.addEventListener('blur', function(){ tot.value = fmt(S.total); });
  $('who').addEventListener('input', function(e){ S.people[S.cur].n = e.target.value; paintTabs(); save(); });
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('addIn').value.trim(); if (!v) return;
    S.people[S.cur].items.push({t:v, ok:false}); $('addIn').value = '';
    paintPack(); save();
    var l = $('list'); l.scrollTop = l.scrollHeight;
  });
  $('reset').addEventListener('click', function(){ S = example(); save(); init(); });
  init();
})();
</script>
</body>
</html>
