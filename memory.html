<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF5FC">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@800;900&display=swap">
<title>זיכרון בריא</title>
<style>
:root{
  --ink:#14203A; --paper:#FFFFFF; --sky:#EAF5FC; --sun:#D4551F; --teal:#0B6672; --green:#1B7745;
  --text:"Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
  --title:"Heebo","Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
  --gap:clamp(8px,1.6vh,14px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sky); color:var(--ink); font-family:var(--text);
  height:100vh; height:100dvh; overflow:hidden; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center; padding:clamp(14px,3vh,32px) clamp(16px,3vw,40px);
}
.wrap{width:100%; height:100%; max-width:1200px; display:grid; grid-template-columns:260px 1fr; gap:clamp(20px,3vw,44px); align-items:center}
aside{display:flex; flex-direction:column; gap:22px}
h1{font-family:var(--title); font-weight:900; font-size:clamp(34px,6.4vh,52px); line-height:1}
h1 span{color:var(--teal)}
.lead{font-size:clamp(17px,2.8vh,22px); line-height:1.35}
.stats{display:flex; gap:12px}
.stat{flex:1; background:var(--paper); border-radius:16px; padding:12px 14px}
.stat b{display:block; font-family:var(--title); font-weight:900; font-size:clamp(30px,5.4vh,42px); line-height:1; font-variant-numeric:tabular-nums; color:var(--teal)}
.stat span{font-size:16px; font-weight:500}
.reset{align-self:flex-start; font-family:var(--text); font-weight:700; font-size:18px; min-height:52px; padding:0 24px;
  border-radius:999px; border:3px solid var(--teal); background:transparent; color:var(--teal); cursor:pointer; white-space:nowrap}
.reset:focus-visible,.card:focus-visible,.again:focus-visible{outline:4px solid var(--sun); outline-offset:3px}

.board{height:100%; max-height:660px; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr); gap:var(--gap); min-height:0}
.card{position:relative; border:0; background:none; padding:0; cursor:pointer; perspective:900px; touch-action:manipulation; min-height:0; font-family:var(--text)}
.inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.card.up .inner,.card.got .inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px}
.back{background:var(--teal);
  background-image:radial-gradient(rgba(255,255,255,.16) 2.5px, transparent 3px);
  background-size:22px 22px}
.back::after{content:""; width:34%; aspect-ratio:1; border-radius:50%; border:4px solid rgba(255,255,255,.85)}
.front{background:var(--paper); transform:rotateY(180deg); border:3px solid transparent}
.front svg{width:62%; height:62%; max-height:120px}
.front .lbl{font-weight:700; font-size:clamp(16px,2.7vh,21px); line-height:1}
.card.got .front{border-color:var(--green)}
.card.got .lbl{color:var(--green)}
.card.miss .front{border-color:var(--sun)}

.win{position:fixed; inset:0; background:rgba(234,245,252,.94); display:none; align-items:center; justify-content:center; flex-direction:column; gap:20px; text-align:center; padding:24px}
.won .win{display:flex}
.win h2{font-family:var(--title); font-weight:900; font-size:clamp(40px,min(10vh,13vw),84px); white-space:nowrap; line-height:1; color:var(--green)}
.win p{font-size:clamp(20px,3.6vh,28px); font-weight:500}
.again{font-family:var(--text); font-weight:700; font-size:clamp(22px,3.8vh,28px); min-height:72px; padding:0 48px; border-radius:999px; border:0; background:var(--teal); color:#fff; cursor:pointer}
.won .win .badge{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

@media (max-width:760px){
  body{align-items:stretch}
  .wrap{grid-template-columns:1fr; grid-template-rows:auto 1fr; gap:14px}
  aside{gap:10px}
  aside .lead{display:none}
  .head{display:flex; align-items:center; justify-content:space-between}
  .stats{gap:8px}
  .stat{padding:8px 12px; display:flex; align-items:baseline; gap:8px}
  .stat b{font-size:28px}
  .row{display:flex; gap:10px; align-items:stretch}
  .row .stats{flex:1}
  .reset{min-height:48px; padding:0 16px; font-size:16px; align-self:stretch}
  .board{grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); max-height:none}
}
@media (prefers-reduced-motion:reduce){
  .inner{transition:none} .won .win .badge{animation:none}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <aside>
    <div class="head"><h1>זיכרון <span>בריא</span></h1></div>
    <p class="lead">הופכים שני קלפים. מצאתם זוג? הוא נשאר פתוח. מי מוצא את כל ששת הזוגות?</p>
    <div class="row">
      <div class="stats">
        <div class="stat"><b id="moves">0</b><span>מהלכים</span></div>
        <div class="stat"><b id="pairs">0/6</b><span>זוגות</span></div>
      </div>
      <button class="reset" id="reset" type="button">ערבוב מחדש</button>
    </div>
  </aside>
  <main class="board" id="board" aria-label="לוח המשחק"></main>
</div>

<div class="win" role="dialog" aria-live="polite">
  <svg class="badge" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="54" fill="#1B7745"/>
    <path d="M34 62 L52 80 L88 42" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h2>כל הכבוד!</h2>
  <p id="winTxt"></p>
  <button class="again" id="again" type="button">שחקו שוב</button>
</div>

<!-- icons: drawn once, used by every card, identical on every device -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-apple" viewBox="0 0 100 100">
      <path d="M50 30 C38 20 16 24 16 50 C16 74 34 92 44 90 C48 89 50 87 50 87 C50 87 52 89 56 90 C66 92 84 74 84 50 C84 24 62 20 50 30 Z" fill="#D4551F" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M50 30 C50 22 52 14 56 9" fill="none" stroke="#14203A" stroke-width="4" stroke-linecap="round"/>
      <path d="M54 20 C60 8 74 8 78 12 C72 22 62 24 54 20 Z" fill="#1B7745" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M28 46 C29 40 33 36 38 34" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-carrot" viewBox="0 0 100 100">
      <path d="M62 30 L74 42 C60 62 40 82 22 90 C18 92 14 88 16 84 C24 66 42 44 62 30 Z" fill="#D4551F" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M44 52 L52 58 M34 66 L40 70 M50 42 L55 46" stroke="#14203A" stroke-width="4" stroke-linecap="round"/>
      <path d="M66 34 C64 22 66 12 72 8 C76 16 74 26 70 34 M70 38 C80 34 88 34 94 38 C88 44 78 44 70 38 M68 36 C76 26 84 22 90 22" fill="#1B7745" stroke="#14203A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-brush" viewBox="0 0 100 100">
      <rect x="14" y="58" width="74" height="14" rx="7" transform="rotate(-30 50 65)" fill="#0B6672" stroke="#14203A" stroke-width="4"/>
      <g transform="rotate(-30 50 65)">
        <rect x="60" y="40" width="26" height="18" rx="3" fill="#EAF5FC" stroke="#14203A" stroke-width="4"/>
        <path d="M66 40 V58 M73 40 V58 M80 40 V58" stroke="#14203A" stroke-width="3"/>
      </g>
      <circle cx="30" cy="28" r="7" fill="#EAF5FC" stroke="#0B6672" stroke-width="3"/>
      <circle cx="44" cy="18" r="4.5" fill="#EAF5FC" stroke="#0B6672" stroke-width="3"/>
    </symbol>
    <symbol id="i-water" viewBox="0 0 100 100">
      <path d="M26 16 H74 L66 88 C66 90 64 92 62 92 H38 C36 92 34 90 34 88 Z" fill="#fff" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M30 44 C40 40 60 48 70 44 L66 88 C66 90 64 92 62 92 H38 C36 92 34 90 34 88 Z" fill="#0B6672" opacity=".9"/>
      <path d="M26 16 H74 L66 88 C66 90 64 92 62 92 H38 C36 92 34 90 34 88 Z" fill="none" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M44 58 C44 54 48 50 50 48 C52 50 56 54 56 58 C56 62 53 64 50 64 C47 64 44 62 44 58 Z" fill="#EAF5FC"/>
    </symbol>
    <symbol id="i-sleep" viewBox="0 0 100 100">
      <path d="M58 16 C38 18 22 34 22 56 C22 78 40 92 60 90 C72 89 82 82 86 74 C62 78 44 62 44 42 C44 30 50 22 58 16 Z" fill="#14203A" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M62 30 H76 L62 46 H76" fill="none" stroke="#0B6672" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M80 12 H88 L80 22 H88" fill="none" stroke="#0B6672" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="36" cy="54" r="3" fill="#EAF5FC"/>
    </symbol>
    <symbol id="i-ball" viewBox="0 0 100 100">
      <circle cx="50" cy="52" r="38" fill="#fff"/>
      <path d="M50 14 C36 26 32 40 32 52 C32 66 38 80 50 90 C28 88 12 72 12 52 C12 32 28 16 50 14 Z" fill="#D4551F"/>
      <path d="M50 14 C64 26 68 40 68 52 C68 66 62 80 50 90 C72 88 88 72 88 52 C88 32 72 16 50 14 Z" fill="#0B6672"/>
      <circle cx="50" cy="52" r="38" fill="none" stroke="#14203A" stroke-width="4"/>
      <path d="M50 14 C36 26 32 40 32 52 C32 66 38 80 50 90 M50 14 C64 26 68 40 68 52 C68 66 62 80 50 90" fill="none" stroke="#14203A" stroke-width="3"/>
      <circle cx="50" cy="20" r="5" fill="#fff" stroke="#14203A" stroke-width="3"/>
    </symbol>
  </defs>
</svg>

<script>
(function(){
  var ITEMS = [
    {k:'apple', t:'תפוח'}, {k:'carrot', t:'גזר'}, {k:'brush', t:'מברשת שיניים'},
    {k:'water', t:'מים'}, {k:'sleep', t:'שינה טובה'}, {k:'ball', t:'משחק בכדור'}
  ];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var board = document.getElementById('board'), movesEl = document.getElementById('moves'), pairsEl = document.getElementById('pairs');
  var open = [], moves = 0, found = 0, lock = false;

  function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function deal(){
    document.body.classList.remove('won');
    board.innerHTML = ''; open = []; moves = 0; found = 0; lock = false; paint();
    shuffle(ITEMS.concat(ITEMS)).forEach(function(it){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'card'; b.dataset.k = it.k;
      b.setAttribute('aria-label', 'קלף סגור');
      b.innerHTML = '<span class="inner"><span class="face back"></span>' +
        '<span class="face front"><svg aria-hidden="true"><use href="#i-' + it.k + '"/></svg><span class="lbl"></span></span></span>';
      b.querySelector('.lbl').textContent = it.t;
      b.addEventListener('click', function(){ flip(b, it); });
      board.appendChild(b);
    });
  }
  function paint(){ movesEl.textContent = moves; pairsEl.textContent = found + '/6'; }
  function flip(b, it){
    if (lock || b.classList.contains('up') || b.classList.contains('got')) return;
    b.classList.add('up'); b.setAttribute('aria-label', it.t);
    open.push(b);
    if (open.length < 2) return;
    moves++; lock = true;
    var a = open[0], c = open[1];
    if (a.dataset.k === c.dataset.k){
      setTimeout(function(){
        a.classList.add('got'); c.classList.add('got'); a.classList.remove('up'); c.classList.remove('up');
        found++; open = []; lock = false; paint();
        if (found === ITEMS.length) setTimeout(win, reduce ? 100 : 500);
      }, reduce ? 50 : 350);
    } else {
      a.classList.add('miss'); c.classList.add('miss');
      setTimeout(function(){
        [a, c].forEach(function(x){ x.classList.remove('up', 'miss'); x.setAttribute('aria-label', 'קלף סגור'); });
        open = []; lock = false;
      }, 1000);
    }
    paint();
  }
  function win(){
    document.getElementById('winTxt').textContent = 'מצאתם את כל ששת הזוגות ב-' + moves + ' מהלכים';
    document.body.classList.add('won');
    document.getElementById('again').focus({preventScroll:true});
  }
  document.getElementById('reset').addEventListener('click', deal);
  document.getElementById('again').addEventListener('click', deal);
  deal();
})();
</script>
</body>
</html>
