<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF5FC">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@800;900&display=swap">
<title>כמה עולים לי המנויים</title>
<style>
:root{
  --ink:#14203A; --paper:#FFFFFF; --sky:#EAF5FC; --sun:#D4551F; --teal:#0B6672; --green:#1B7745;
  --line:rgba(11,102,114,.18);
  --text:"Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
  --title:"Heebo","Assistant",'Arial Hebrew','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sky); color:var(--ink); font-family:var(--text);
  height:100vh; height:100dvh; overflow:hidden; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center; padding:clamp(14px,3vh,30px) clamp(16px,3vw,40px);
}
input,button{font-family:var(--text); color:var(--ink)}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:4px solid var(--sun); outline-offset:3px}
.wrap{width:100%; height:100%; max-width:1200px; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); grid-template-areas:"title hero" "list hero"; column-gap:clamp(16px,2.4vw,36px); row-gap:clamp(10px,1.8vh,16px)}
.titlebox{grid-area:title; display:flex; flex-direction:column; gap:8px} .panel{grid-area:list} .hero{grid-area:hero}
.panel{background:var(--paper); border-radius:20px; padding:clamp(16px,2.6vh,24px) clamp(16px,2vw,26px); display:flex; flex-direction:column; min-height:0; gap:clamp(8px,1.4vh,12px)}
h1{font-family:var(--title); font-weight:900; font-size:clamp(30px,5.6vh,44px); line-height:1.05}
h1 span{color:var(--teal)}
.lead{display:flex; align-items:center; gap:10px; font-size:clamp(16px,2.6vh,19px); font-weight:500; opacity:.85}
.tag{display:inline-block; font-size:14px; font-weight:700; color:var(--teal); background:var(--sky); border-radius:999px; padding:3px 10px; white-space:nowrap; line-height:1.3}
.lead .tag{background:#fff}
.head{display:grid; grid-template-columns:1fr 130px 112px 40px; gap:10px; font-size:15px; font-weight:700; opacity:.6; padding:0 4px}
.rows{list-style:none; flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:clamp(6px,1.1vh,9px); margin:0 -6px; padding:2px 6px}
.row{display:grid; grid-template-columns:1fr 130px 112px 40px; gap:10px; align-items:center; border-radius:14px; padding:0 4px; transition:opacity .25s}
.name{display:flex; align-items:center; gap:8px; min-width:0; border-bottom:3px dashed transparent}
.name:focus-within{border-bottom-color:var(--sun)}
.name input{flex:1; min-width:0; border:0; background:transparent; font-weight:700; font-size:clamp(18px,3vh,22px); min-height:clamp(42px,6.6vh,52px); padding:0}
.name input:focus{outline:none}
.money{display:flex; align-items:center; gap:6px; background:var(--sky); border-radius:12px; padding:0 10px; border:3px solid transparent}
.money:focus-within{border-color:var(--sun)}
.money input{width:100%; min-width:0; border:0; background:transparent; font-weight:700; font-size:clamp(18px,3vh,22px); min-height:clamp(40px,6.2vh,48px); text-align:left; direction:ltr; font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money span{font-size:15px; font-weight:500; opacity:.7; white-space:nowrap}
.sw{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:16px; font-weight:700; white-space:nowrap; min-height:44px}
.sw input{position:absolute; opacity:0; width:1px; height:1px}
.track{flex:none; width:50px; height:30px; border-radius:15px; background:#C9DCE3; position:relative; transition:background .2s}
.track::after{content:""; position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(20,32,58,.25); transition:transform .2s}
.sw input:checked + .track{background:var(--sun)}
.sw input:checked + .track::after{transform:translateX(-20px)}
.sw input:focus-visible + .track{outline:4px solid var(--sun); outline-offset:2px}
.row.cut .name input,.row.cut .money input{text-decoration:line-through; text-decoration-thickness:3px; text-decoration-color:var(--sun); opacity:.55}
.row.cut .tag{opacity:.5}
.row.cut .sw{color:var(--sun)}
.del{width:44px; height:44px; border:0; background:transparent; border-radius:50%; opacity:.35; display:grid; place-items:center}
.del:hover{opacity:.8; background:var(--sky)}
.del svg{width:16px; height:16px}
.addbtn{align-self:flex-start; display:flex; align-items:center; gap:8px; min-height:52px; padding:0 22px; border-radius:999px; border:3px dashed var(--teal); background:transparent; color:var(--teal); font-weight:700; font-size:18px}
.addbtn svg{width:18px; height:18px}

.hero{display:flex; flex-direction:column; justify-content:center; gap:clamp(10px,2vh,18px); min-height:0}
.month{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.month .k{font-size:clamp(19px,3.2vh,24px); font-weight:700}
.month .v{font-family:var(--title); font-weight:900; font-size:clamp(34px,6.4vh,50px); color:var(--ink); font-variant-numeric:tabular-nums; line-height:1}
.year{background:var(--teal); color:#fff; border-radius:24px; padding:clamp(16px,3vh,28px) clamp(18px,2.4vw,30px)}
.year .k{font-size:clamp(20px,3.4vh,26px); font-weight:700; opacity:.9}
.year .v{font-family:var(--title); font-weight:900; font-size:clamp(70px,17vh,132px); line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap}
.year .cur{font-family:var(--title); font-weight:900; font-size:clamp(26px,5vh,40px)}
.year .x{font-size:clamp(16px,2.6vh,19px); font-weight:500; opacity:.85; margin-top:4px}
.save{border-radius:20px; padding:clamp(14px,2.4vh,20px) clamp(16px,2vw,22px); background:var(--paper); border:3px solid var(--green); display:flex; flex-direction:column; gap:4px}
.save .big{font-family:var(--title); font-weight:900; font-size:clamp(24px,4.6vh,36px); color:var(--green); line-height:1.15}
.save .small{font-size:clamp(16px,2.6vh,19px); font-weight:500}
.save.none{border-style:dashed; border-color:var(--line)}
.save.none .big{color:var(--ink); font-size:clamp(20px,3.4vh,26px)}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.96)}100%{transform:scale(1)}}

@media (max-width:820px){
  body{height:auto; min-height:100dvh; overflow:auto; display:block}
  .wrap{grid-template-columns:minmax(0,1fr); grid-template-areas:"title" "hero" "list"; height:auto}
  .year .v{font-size:min(132px,17vw)} .year .cur{font-size:min(40px,7vw)}
  .rows{overflow:visible}
  .head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto 40px; grid-template-areas:"n n d" "m s s"; row-gap:2px; padding:8px 4px; border-bottom:2px solid var(--sky); border-radius:0}
  .row .name{grid-area:n} .row .money{grid-area:m} .row .del{grid-area:d} .row .sw{grid-area:s; justify-self:end} .row .money{width:140px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebox">
    <h1>כמה עולים לי <span>המנויים</span></h1>
    <div class="lead"><span class="tag">דוגמה</span>אפשר לשנות כל שם וכל מחיר</div>
  </div>
  <section class="panel">
    <div class="head" aria-hidden="true"><span>מנוי</span><span>בחודש</span><span>מבטל?</span><span></span></div>
    <ul class="rows" id="rows"></ul>
    <button class="addbtn" id="add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>מנוי חדש</button>
  </section>

  <section class="hero" aria-live="polite">
    <div class="month"><span class="k">בחודש</span><span class="v" id="month">0</span><span class="k">ש״ח</span></div>
    <div class="year" id="yearBox">
      <div class="k">ובשנה שלמה</div>
      <div class="v"><span id="year">0</span> <span class="cur">ש״ח</span></div>
      <div class="x" id="yearX"></div>
    </div>
    <div class="save" id="save"><div class="big" id="saveBig"></div><div class="small" id="saveSmall"></div></div>
  </section>
</div>

<script>
(function(){
  var KEY = 'subs-v1';
  var X = '<svg viewBox="0 0 24 24" fill="none" stroke="#14203A" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function example(){
    return [
      {n:'סלולר', p:60, ex:true}, {n:'אינטרנט ביתי', p:100, ex:true}, {n:'סטרימינג', p:50, ex:true},
      {n:'מוזיקה', p:25, ex:true}, {n:'חדר כושר', p:200, ex:true, cut:true}, {n:'אחסון בענן', p:10, ex:true}
    ];
  }
  var R;
  try { R = JSON.parse(localStorage.getItem(KEY)); } catch (e) { R = null; }
  if (!Array.isArray(R)) R = example();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) {} }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){ return document.getElementById(id); };
  function fmt(n){ return Math.round(n).toLocaleString('he-IL'); }
  function num(s){ var v = parseInt(String(s).replace(/[^\d]/g, ''), 10); return isNaN(v) ? 0 : v; }

  var shown = {}; // count-up animation state per element
  function countTo(el, target){
    var from = shown[el.id] == null ? target : shown[el.id];
    shown[el.id] = target;
    if (reduce || from === target){ el.textContent = fmt(target); return; }
    var t0 = performance.now(), dur = 500;
    (function step(t){
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(from + (target - from) * e);
      if (k < 1 && shown[el.id] === target) requestAnimationFrame(step);
    })(t0);
  }

  function build(){
    var box = $('rows'); box.innerHTML = '';
    R.forEach(function(r, i){
      var li = document.createElement('li'); li.className = 'row' + (r.cut ? ' cut' : '');
      li.innerHTML = '<label class="name"><input type="text" maxlength="24"></label>' +
        '<label class="money"><input inputmode="numeric"><span>ש״ח</span></label>' +
        '<label class="sw"><input type="checkbox"><span class="track"></span>מבטל?</label>' +
        '<button class="del" type="button">' + X + '</button>';
      var nm = li.querySelector('.name input'), pr = li.querySelector('.money input'), cb = li.querySelector('.sw input');
      nm.value = r.n; nm.setAttribute('aria-label', 'שם המנוי'); nm.placeholder = 'שם המנוי';
      if (r.ex){ var t = document.createElement('span'); t.className = 'tag'; t.textContent = 'דוגמה'; li.querySelector('.name').appendChild(t); }
      pr.value = fmt(r.p); pr.setAttribute('aria-label', 'מחיר לחודש של ' + r.n);
      cb.checked = !!r.cut; cb.setAttribute('aria-label', 'מבטל את ' + r.n);
      nm.addEventListener('input', function(){ r.n = nm.value; if (r.ex){ r.ex = false; var tg = li.querySelector('.tag'); if (tg) tg.remove(); } paint(); save(); });
      pr.addEventListener('input', function(){ r.p = num(pr.value); if (r.ex){ r.ex = false; var tg = li.querySelector('.tag'); if (tg) tg.remove(); } paint(); save(); });
      pr.addEventListener('focus', function(){ pr.value = r.p || ''; pr.select(); });
      pr.addEventListener('blur', function(){ pr.value = fmt(r.p); });
      cb.addEventListener('change', function(){ r.cut = cb.checked; li.classList.toggle('cut', r.cut); paint(); save(); });
      li.querySelector('.del').setAttribute('aria-label', 'להסיר את ' + (r.n || 'המנוי'));
      li.querySelector('.del').addEventListener('click', function(){ R.splice(i, 1); build(); paint(); save(); });
      box.appendChild(li);
    });
  }
  function paint(){
    var month = R.reduce(function(a, r){ return a + r.p; }, 0);
    var cut = R.filter(function(r){ return r.cut; });
    var cutMonth = cut.reduce(function(a, r){ return a + r.p; }, 0);
    countTo($('month'), month);
    countTo($('year'), month * 12);
    $('yearX').textContent = fmt(month) + ' ש״ח כפול 12 חודשים, על ' + R.length + ' מנויים';
    var sv = $('save');
    if (cut.length){
      sv.classList.remove('none');
      $('saveBig').textContent = 'חוסכים ' + fmt(cutMonth * 12) + ' ש״ח בשנה';
      var names = cut.map(function(r){ return r.n || 'מנוי בלי שם'; }).join(', ');
      $('saveSmall').textContent = 'אם מבטלים: ' + names + '. נשארים ' + fmt((month - cutMonth) * 12) + ' ש״ח בשנה.';
    } else {
      sv.classList.add('none');
      $('saveBig').textContent = 'מה אפשר לבטל?';
      $('saveSmall').textContent = 'מסמנים "מבטל?" ליד מנוי, ורואים כמה נחסך בשנה.';
    }
    if (!reduce){ sv.classList.remove('pop'); void sv.offsetWidth; sv.classList.add('pop'); }
    $('add').style.display = R.length >= 12 ? 'none' : '';
  }
  $('add').addEventListener('click', function(){
    R.push({n:'', p:0}); build(); paint(); save();
    var inputs = document.querySelectorAll('.row .name input'); var last = inputs[inputs.length - 1];
    last.focus(); $('rows').scrollTop = $('rows').scrollHeight;
  });
  build(); paint();
})();
</script>
</body>
</html>
